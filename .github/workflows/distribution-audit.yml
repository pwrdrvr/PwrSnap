name: Audit Winget and Homebrew sources

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      stage:
        type: string
        default: standalone
    secrets:
      DISTRIBUTION_READ_TOKEN:
        required: false
  pull_request:
    paths:
      - .github/workflows/distribution-audit.yml
      - .github/workflows/release.yml
      - scripts/release/audit-package-channels*
      - .agents/skills/release/**
      - docs/package-manager-release-runbook.md

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Test audit failure handling
        run: node --test scripts/release/audit-package-channels.test.cjs

      - name: Audit public package sources and existing submissions
        env:
          # Organization-provided public-read-only PAT; never a push/submission credential.
          # Fork PRs lack org secrets and retain the workflow-token fallback.
          GH_TOKEN: ${{ secrets.DISTRIBUTION_READ_TOKEN || github.token }}
          DISTRIBUTION_READ_TOKEN_AVAILABLE: ${{ secrets.DISTRIBUTION_READ_TOKEN != '' }}
        run: |
          if [ "$DISTRIBUTION_READ_TOKEN_AVAILABLE" = true ]; then
            echo 'Public-source credential: organization DISTRIBUTION_READ_TOKEN (value withheld)'
          else
            echo 'Public-source credential: default workflow token fallback'
          fi
          node scripts/release/audit-package-channels.mjs .local/distribution-audit.json

      - name: Preserve source audit or actionable blocker
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-audit-${{ inputs.stage || 'standalone' }}
          path: .local/distribution-audit.json
          if-no-files-found: error
          retention-days: 14
