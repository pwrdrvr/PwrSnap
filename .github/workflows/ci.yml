name: CI

on:
  push:
    branches:
      - main
      - "releases/**"
  pull_request:
    # Include windows-gui-port so the stacked Windows-port PRs (installer,
    # window-picker, …) that target it get CI, not just PRs to main.
    branches:
      - main
      - "releases/**"
      - windows-gui-port
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

# Supersede obsolete PR runs; give each branch commit its own group so pending
# main/release runs cannot replace one another even with cancellation disabled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# configure-nodejs hashes lock bytes, workspace manifests/config, OS/arch,
# ImageOS, Node major/ABI and its own implementation. Hash lifecycle inputs too.
# The policy suffix binds the reviewed action and portable pnpm import policy.
env:
  PWRSNAP_DEPENDENCY_CACHE_POLICY: pwrsnap-install-v1-d416c1c78119b25fe03ee3ef78b75af0d69b10a7
  PWRSNAP_DEPENDENCY_CACHE_INPUTS: |
    .nvmrc
    .pnpmfile-global.cjs
    scripts/check-node-version.mjs
    scripts/lib/cli-entrypoint.mjs
    scripts/linux-sandbox.mjs
    apps/desktop/scripts/ensure-electron-runtime.mjs
    apps/desktop/scripts/electron-runtime-cache.mjs
    apps/desktop/scripts/build-native.mjs
    apps/desktop/native/pasteboard-writer/main.swift
    apps/desktop/native/preview-extension/Info.plist
    apps/desktop/native/preview-extension/preview-provider.swift
    apps/desktop/native/recorder/audio-level.swift
    apps/desktop/native/recorder/main.swift
    apps/desktop/native/recorder/microphone.swift
    apps/desktop/native/recorder/tests/microphone-match.swift
    apps/desktop/native/recorder/tests/microphone-roundtrip.swift
    apps/desktop/native/recorder/tests/no-device-io.c
    apps/desktop/native/screen-snapshot-win/main.cpp
    apps/desktop/native/thumbnail-extension/Info.plist
    apps/desktop/native/thumbnail-extension/cli.swift
    apps/desktop/native/thumbnail-extension/zip-reader.swift
    apps/desktop/native/verified-file-win/main.cpp
    apps/desktop/native/window-list-win/main.cpp
    apps/desktop/native/window-list/main.swift

jobs:
  # Keep the pull_request trigger path-unfiltered so the required check jobs
  # exist on every PR. Documentation/agent-skill-only PRs skip those jobs below.
  changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code_impacting: ${{ steps.classify.outputs.code_impacting }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Classify changed files
        id: classify
        uses: actions/github-script@v9
        with:
          script: |
            const fullCi = (reason) => {
              core.setOutput("code_impacting", "true");
              core.setOutput("docs_only", "false");
              core.notice(`Running full CI: ${reason}`);
            };

            if (context.eventName !== "pull_request") {
              fullCi(`${context.eventName} events are never docs-only`);
              return;
            }

            let files;
            try {
              files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              });
            } catch (error) {
              fullCi(`changed-file lookup failed (${error.message})`);
              return;
            }

            const reportedCount = context.payload.pull_request.changed_files;
            if (!Array.isArray(files) || files.length === 0 || files.length !== reportedCount
              || files.some((file) => !file || typeof file.filename !== "string" || !file.filename
                || (file.status === "renamed"
                  && (typeof file.previous_filename !== "string" || !file.previous_filename)))) {
              fullCi(
                `changed-file list was incomplete (received ${files?.length ?? "unknown"} of ${reportedCount})`,
              );
              return;
            }

            const isDocumentationPath = (path) => {
              if (path.startsWith(".agents/skills/")) return true;
              if (path.startsWith("docs/")) return true;
              if (!path.toLowerCase().endsWith(".md")) return false;
              // Prompt Markdown is copied into the packaged app
              // (`out/main/prompts`) and loaded at runtime. A prompt-only
              // PR is code-impacting and must not skip CI.
              return !/(^|\/)src\//.test(path);
            };
            const codeImpactingFile = files.find((file) => {
              const paths = [file.filename, file.previous_filename].filter(Boolean);
              return paths.some((path) => !isDocumentationPath(path));
            });
            const docsOnly = codeImpactingFile === undefined;

            core.setOutput("code_impacting", String(!docsOnly));
            core.setOutput("docs_only", String(docsOnly));
            await core.summary
              .addHeading("Changed-file classification")
              .addTable([
                [{data: "Classification", header: true}, {data: "Files", header: true}],
                [docsOnly ? "Documentation or agent skills only" : "Code impacting", String(files.length)],
              ])
              .addRaw(
                docsOnly
                  ? "Only `docs/**`, non-source Markdown, or `.agents/skills/**` changed; expensive CI jobs are skipped."
                  : `Full CI runs because \`${codeImpactingFile.filename}\` is not documentation-only.`,
              )
              .write();

  # One completed-tree producer per hosted OS/architecture/image family.
  # Producers frozen-install with lifecycle scripts on a miss; consumers require
  # an exact hit and never install or repair. Inputs and policy must agree.
  # Only node_modules is archived: Windows consumers build native helpers below.
  install-deps:
    name: Install Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.code_impacting == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@d416c1c78119b25fe03ee3ef78b75af0d69b10a7 # v1.7.1
        timeout-minutes: 10
        with:
          node-version: "^24.22.0"
          dependency-cache: node-modules
          cache-mode: populate
          cache-key-suffix: ${{ env.PWRSNAP_DEPENDENCY_CACHE_POLICY }}
          cache-inputs: ${{ env.PWRSNAP_DEPENDENCY_CACHE_INPUTS }}

  windows-install-deps:
    name: Install Dependencies (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.code_impacting == 'true'
    steps:
      # Hosted Windows system-drive temp I/O can stall; use the runner work volume.
      - name: Move temporary files to runner temp
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@d416c1c78119b25fe03ee3ef78b75af0d69b10a7 # v1.7.1
        timeout-minutes: 10
        with:
          node-version: "^24.22.0"
          dependency-cache: node-modules
          cache-mode: populate
          cache-key-suffix: ${{ env.PWRSNAP_DEPENDENCY_CACHE_POLICY }}
          cache-inputs: ${{ env.PWRSNAP_DEPENDENCY_CACHE_INPUTS }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    env:
      # Prevent pnpm 12 run commands from implicitly repairing a restored tree.
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@d416c1c78119b25fe03ee3ef78b75af0d69b10a7 # v1.7.1
        timeout-minutes: 10
        with:
          node-version: "^24.22.0"
          dependency-cache: node-modules
          cache-mode: restore
          cache-key-suffix: ${{ env.PWRSNAP_DEPENDENCY_CACHE_POLICY }}
          cache-inputs: ${{ env.PWRSNAP_DEPENDENCY_CACHE_INPUTS }}

      - name: Lint
        run: pnpm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    env:
      # Prevent pnpm 12 run commands from implicitly repairing a restored tree.
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@d416c1c78119b25fe03ee3ef78b75af0d69b10a7 # v1.7.1
        timeout-minutes: 10
        with:
          node-version: "^24.22.0"
          dependency-cache: node-modules
          cache-mode: restore
          cache-key-suffix: ${{ env.PWRSNAP_DEPENDENCY_CACHE_POLICY }}
          cache-inputs: ${{ env.PWRSNAP_DEPENDENCY_CACHE_INPUTS }}

      - name: Build
        run: pnpm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    env:
      # Prevent pnpm 12 run commands from implicitly repairing a restored tree.
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@d416c1c78119b25fe03ee3ef78b75af0d69b10a7 # v1.7.1
        timeout-minutes: 10
        with:
          node-version: "^24.22.0"
          dependency-cache: node-modules
          cache-mode: restore
          cache-key-suffix: ${{ env.PWRSNAP_DEPENDENCY_CACHE_POLICY }}
          cache-inputs: ${{ env.PWRSNAP_DEPENDENCY_CACHE_INPUTS }}

      - name: Test
        id: unit-tests
        continue-on-error: true
        env:
          PWRSNAP_CI_TEST_REPORT: ${{ github.workspace }}/.local/ci/retry/unit-first.json
        run: pnpm run test --reporter=default --reporter=./scripts/ci/vitest-ci-reporter.mjs

      - name: Verify unit selection completed
        id: unit-completion
        if: steps.unit-tests.outcome == 'success'
        env:
          PWRSNAP_CI_RETRY_DIR: .local/ci/retry
        run: node scripts/ci/run-retry-failures.mjs unit-verify

      - name: Retry failed unit tests
        id: unit-tests-retry
        if: steps.unit-tests.outcome == 'failure'
        env:
          PWRSNAP_CI_RETRY_DIR: .local/ci/retry
        run: pnpm exec node scripts/ci/run-retry-failures.mjs unit

      - name: Record unit slice
        if: ${{ !cancelled() }}
        uses: ./.github/actions/flake-slice
        with:
          kind: unit
          platform: linux
          lane: "1"
          directory: .local/ci/retry
          first-outcome: ${{ steps.unit-tests.outcome }}
          retry-outcome: ${{ steps.unit-tests-retry.outcome }}

      - name: Upload unit retry diagnostics
        if: ${{ !cancelled() && (steps.unit-tests.outcome == 'failure' || steps.unit-completion.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-diagnostics-linux-1
          path: .local/ci/retry/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  desktop-e2e:
    # Renamed from "Desktop E2E": that name is now the aggregate job at the
    # bottom of this file, which is what the branch-protection ruleset
    # requires. This job is one platform of three feeding it.
    name: Linux Desktop E2E
    runs-on: ubuntu-latest
    needs: [changes, install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    timeout-minutes: 30
    env:
      PWRSNAP_CI_RETRY_DIR: .local/ci/retry
      PLAYWRIGHT_LAST_RUN_OUTPUT_FILE: ${{ github.workspace }}/.local/ci/retry/e2e-last.json
      PWRSNAP_E2E_SKIP_LINUX_VISUAL_REGRESSION: "1"
      # Prevent pnpm 12 run commands from implicitly repairing a restored tree.
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        # Linux visual regression is temporarily excluded below, but retain
        # its LFS checkout so re-enabling it does not need a workflow change.
        with:
          lfs: true

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@d416c1c78119b25fe03ee3ef78b75af0d69b10a7 # v1.7.1
        timeout-minutes: 10
        with:
          node-version: "^24.22.0"
          dependency-cache: node-modules
          cache-mode: restore
          cache-key-suffix: ${{ env.PWRSNAP_DEPENDENCY_CACHE_POLICY }}
          cache-inputs: ${{ env.PWRSNAP_DEPENDENCY_CACHE_INPUTS }}

      - name: Prepare E2E report directory
        run: |
          node -e "require('fs').mkdirSync('.local/ci/retry', { recursive: true })"

      - name: Run desktop Electron E2E specs
        id: e2e-tests
        continue-on-error: true
        env:
          PWRSNAP_CI_TEST_REPORT: ${{ github.workspace }}/.local/ci/retry/e2e-first.json
        # The macOS-only specs (screencapture-based) are gated via
        # `test.skip(!isMac)` and don't fail the suite on Linux.
        #
        # No `playwright install-deps` step: `ubuntu-latest` ships
        # Chrome + Firefox preinstalled, which drag in the GTK +
        # libnss / libgbm / libasound stack Electron needs under
        # xvfb. PwrAgnt's CI has been running Electron E2E this way
        # for months without issue, and the apt-install step it
        # replaces routinely takes 2–5 minutes on cold mirrors. If a
        # specific library turns out to be missing in some future
        # ubuntu-latest revision, add a targeted `apt-get install -y
        # libfoo` (~15s) instead of bringing back the full
        # `playwright install-deps` blast.
        # TODO(ci): Stabilize Linux/xvfb visual-regression.spec.ts, then remove
        # this flag to explicitly re-enable its Linux visual coverage.
        run: xvfb-run --auto-servernum pnpm run test:desktop-e2e

      - name: Verify E2E selection completed
        if: steps.e2e-tests.outcome == 'success'
        run: node scripts/ci/run-retry-failures.mjs e2e-first-verify

      - name: Select failed E2E tests
        id: e2e-selection
        if: steps.e2e-tests.outcome == 'failure'
        run: node scripts/ci/run-retry-failures.mjs e2e-prepare

      - name: Retry failed E2E tests
        id: e2e-retry
        if: steps.e2e-tests.outcome == 'failure' && steps.e2e-selection.outcome == 'success'
        continue-on-error: true
        env:
          PWRSNAP_CI_TEST_REPORT: ${{ github.workspace }}/.local/ci/retry/e2e-retry.json
        run: xvfb-run --auto-servernum pnpm --filter @pwrsnap/desktop exec playwright test -c playwright.config.ts --last-failed --retries=0 --trace=retain-on-failure

      - name: Check E2E retry results
        if: steps.e2e-tests.outcome == 'failure' && steps.e2e-selection.outcome == 'success'
        env:
          PWRSNAP_RETRY_OUTCOME: ${{ steps.e2e-retry.outcome }}
        run: node scripts/ci/run-retry-failures.mjs e2e-verify

      - name: Record E2E slice
        if: ${{ !cancelled() }}
        uses: ./.github/actions/flake-slice
        with:
          kind: e2e
          platform: linux
          lane: "1"
          directory: .local/ci/retry
          first-outcome: ${{ steps.e2e-tests.outcome }}
          retry-outcome: ${{ steps.e2e-retry.outcome }}

      - name: Upload desktop Playwright artifacts
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: desktop-e2e-artifacts
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
            .local/ci/retry/
          include-hidden-files: true
          retention-days: 30

  desktop-e2e-macos:
    name: macOS Desktop E2E
    # Standard GitHub-hosted Apple Silicon, with a fresh VM for every job.
    # Fork PRs run here too; never move this public repository's CI back to
    # self-hosted machines. Keep macos-26 for the matching packaging host.
    if: needs.changes.outputs.code_impacting == 'true'
    runs-on: macos-26
    needs: changes
    timeout-minutes: 40
    env:
      PWRSNAP_CI_RETRY_DIR: .local/ci/retry
      PLAYWRIGHT_LAST_RUN_OUTPUT_FILE: ${{ github.workspace }}/.local/ci/retry/e2e-last.json
      PWRSNAP_E2E_DISABLE_GPU: "1"
      RUSTUP_TOOLCHAIN: "1.94.1"
    steps:
      # Visual-regression goldens are Git LFS objects. Fetch the macOS
      # references for the active visual CI lane.
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: true

      # pnpm's postinstall builds the MCP relay. Pin its Rust toolchain
      # before dependency lifecycle scripts run on the hosted image.
      - name: Install Rust toolchain
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o "$RUNNER_TEMP/pwrsnap-rustup-init.sh"
            sh "$RUNNER_TEMP/pwrsnap-rustup-init.sh" -y --profile minimal --default-toolchain none --no-modify-path
          fi
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@d416c1c78119b25fe03ee3ef78b75af0d69b10a7 # v1.7.1
        timeout-minutes: 10
        with:
          node-version: "^24.22.0"
          cache-electron: "true"

      - name: Build native helpers
        run: pnpm rebuild:electron-native

      - name: Prepare E2E report directory
        run: |
          node -e "require('fs').mkdirSync('.local/ci/retry', { recursive: true })"

      - name: Run desktop Electron E2E specs
        id: e2e-tests
        continue-on-error: true
        env:
          PWRSNAP_CI_TEST_REPORT: ${{ github.workspace }}/.local/ci/retry/e2e-first.json
        # Hosted macOS runners provide a GUI session with a virtual GPU.
        # Software rendering avoids known virtual-GPU visibility flakes; see
        # docs/solutions/2026-08-01-vm-e2e-window-visibility-flakes.md.
        run: pnpm run test:desktop-e2e

      - name: Verify E2E selection completed
        if: steps.e2e-tests.outcome == 'success'
        run: node scripts/ci/run-retry-failures.mjs e2e-first-verify

      - name: Select failed E2E tests
        id: e2e-selection
        if: steps.e2e-tests.outcome == 'failure'
        run: node scripts/ci/run-retry-failures.mjs e2e-prepare

      - name: Retry failed E2E tests
        id: e2e-retry
        if: steps.e2e-tests.outcome == 'failure' && steps.e2e-selection.outcome == 'success'
        continue-on-error: true
        env:
          PWRSNAP_CI_TEST_REPORT: ${{ github.workspace }}/.local/ci/retry/e2e-retry.json
        run: pnpm --filter @pwrsnap/desktop exec playwright test -c playwright.config.ts --last-failed --retries=0 --trace=retain-on-failure

      - name: Check E2E retry results
        if: steps.e2e-tests.outcome == 'failure' && steps.e2e-selection.outcome == 'success'
        env:
          PWRSNAP_RETRY_OUTCOME: ${{ steps.e2e-retry.outcome }}
        run: node scripts/ci/run-retry-failures.mjs e2e-verify

      - name: Record E2E slice
        if: ${{ !cancelled() }}
        uses: ./.github/actions/flake-slice
        with:
          kind: e2e
          platform: macos
          lane: "1"
          directory: .local/ci/retry
          first-outcome: ${{ steps.e2e-tests.outcome }}
          retry-outcome: ${{ steps.e2e-retry.outcome }}

      - name: Upload desktop Playwright artifacts
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: desktop-e2e-macos-artifacts
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
            .local/ci/retry/
          include-hidden-files: true
          retention-days: 30

  windows:
    name: Windows (lint + build + test)
    # Scope is the unit suite + build + lint — the Electron GUI E2E (screen
    # capture, tray, AppKit windowing) is macOS-specific and not yet ported to
    # Windows.
    runs-on: windows-latest
    needs: [changes, windows-install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    timeout-minutes: 30
    env:
      # Prevent pnpm 12 run commands from implicitly repairing a restored tree.
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
    steps:
      # Hosted Windows system-drive temp I/O can stall; use the runner work volume.
      - name: Move temporary files to runner temp
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout repository
        uses: actions/checkout@v5

      # Same action as the Linux jobs: it runs natively on Windows (no bash
      # assumptions) and activates the pnpm version pinned in package.json's
      # `packageManager` field via Corepack, so there's no second pnpm pin to
      # drift on upgrade.
      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@d416c1c78119b25fe03ee3ef78b75af0d69b10a7 # v1.7.1
        timeout-minutes: 10
        with:
          node-version: "^24.22.0"
          dependency-cache: node-modules
          cache-mode: restore
          cache-key-suffix: ${{ env.PWRSNAP_DEPENDENCY_CACHE_POLICY }}
          cache-inputs: ${{ env.PWRSNAP_DEPENDENCY_CACHE_INPUTS }}

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      # Compile from source in this job (do not rely on a restored install
      # artifact), then prove clipboard ownership survives the writer process:
      # a separate helper process reopens numeric CF_HDROP and reads the exact
      # fully-qualified temp path through DragQueryFileW.
      - name: Build native Windows clipboard helper
        shell: pwsh
        run: |
          Remove-Item -LiteralPath apps/desktop/build/native/window-list.exe -Force -ErrorAction SilentlyContinue
          pnpm --filter @pwrsnap/desktop build:native

      - name: Smoke-test native CF_HDROP round trip
        id: smoke-tests
        continue-on-error: true
        env:
          PWRSNAP_CI_TEST_REPORT: ${{ github.workspace }}/.local/ci/smoke/unit-first.json
          PWRSNAP_WINDOWS_NATIVE_CLIPBOARD_SMOKE: "1"
        run: >-
          pnpm exec vitest run --config vitest.workspace.ts
          apps/desktop/src/main/clipboard/__tests__/windows-file-clipboard-native.test.ts
          --reporter=default --reporter=./scripts/ci/vitest-ci-reporter.mjs

      - name: Verify unit selection completed
        id: smoke-completion
        if: steps.smoke-tests.outcome == 'success'
        env:
          PWRSNAP_CI_RETRY_DIR: .local/ci/smoke
          PWRSNAP_WINDOWS_NATIVE_CLIPBOARD_SMOKE: "1"
        run: node scripts/ci/run-retry-failures.mjs unit-verify

      - name: Retry failed unit tests
        id: smoke-tests-retry
        if: steps.smoke-tests.outcome == 'failure'
        env:
          PWRSNAP_CI_RETRY_DIR: .local/ci/smoke
          PWRSNAP_WINDOWS_NATIVE_CLIPBOARD_SMOKE: "1"
        run: pnpm exec node scripts/ci/run-retry-failures.mjs unit

      - name: Record unit slice
        if: ${{ !cancelled() }}
        uses: ./.github/actions/flake-slice
        with:
          kind: unit
          platform: windows
          lane: "2"
          directory: .local/ci/smoke
          first-outcome: ${{ steps.smoke-tests.outcome }}
          retry-outcome: ${{ steps.smoke-tests-retry.outcome }}

      - name: Upload unit retry diagnostics
        if: ${{ !cancelled() && (steps.smoke-tests.outcome == 'failure' || steps.smoke-completion.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-diagnostics-windows-2
          path: .local/ci/smoke/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Test
        id: unit-tests
        continue-on-error: true
        env:
          PWRSNAP_CI_TEST_REPORT: ${{ github.workspace }}/.local/ci/retry/unit-first.json
        run: pnpm run test --reporter=default --reporter=./scripts/ci/vitest-ci-reporter.mjs

      - name: Verify unit selection completed
        id: unit-completion
        if: steps.unit-tests.outcome == 'success'
        env:
          PWRSNAP_CI_RETRY_DIR: .local/ci/retry
        run: node scripts/ci/run-retry-failures.mjs unit-verify

      - name: Retry failed unit tests
        id: unit-tests-retry
        if: steps.unit-tests.outcome == 'failure'
        env:
          PWRSNAP_CI_RETRY_DIR: .local/ci/retry
        run: pnpm exec node scripts/ci/run-retry-failures.mjs unit

      - name: Record unit slice
        if: ${{ !cancelled() }}
        uses: ./.github/actions/flake-slice
        with:
          kind: unit
          platform: windows
          lane: "1"
          directory: .local/ci/retry
          first-outcome: ${{ steps.unit-tests.outcome }}
          retry-outcome: ${{ steps.unit-tests-retry.outcome }}

      - name: Upload unit retry diagnostics
        if: ${{ !cancelled() && (steps.unit-tests.outcome == 'failure' || steps.unit-completion.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-diagnostics-windows-1
          path: .local/ci/retry/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  windows-e2e:
    name: Windows Desktop E2E
    runs-on: windows-latest
    needs: [changes, windows-install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    timeout-minutes: 40
    env:
      PWRSNAP_CI_RETRY_DIR: .local/ci/retry
      PLAYWRIGHT_LAST_RUN_OUTPUT_FILE: ${{ github.workspace }}/.local/ci/retry/e2e-last.json
      # Prevent pnpm 12 run commands from implicitly repairing a restored tree.
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
    steps:
      # Hosted Windows system-drive temp I/O can stall; use the runner work volume.
      - name: Move temporary files to runner temp
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@d416c1c78119b25fe03ee3ef78b75af0d69b10a7 # v1.7.1
        timeout-minutes: 10
        with:
          node-version: "^24.22.0"
          dependency-cache: node-modules
          cache-mode: restore
          cache-key-suffix: ${{ env.PWRSNAP_DEPENDENCY_CACHE_POLICY }}
          cache-inputs: ${{ env.PWRSNAP_DEPENDENCY_CACHE_INPUTS }}

      # Completed trees exclude apps/desktop/build/native.
      - name: Build native helpers
        run: pnpm rebuild:electron-native

      - name: Prepare E2E report directory
        run: |
          node -e "require('fs').mkdirSync('.local/ci/retry', { recursive: true })"

      - name: Run desktop Electron E2E specs (Windows)
        id: e2e-tests
        continue-on-error: true
        env:
          PWRSNAP_CI_TEST_REPORT: ${{ github.workspace }}/.local/ci/retry/e2e-first.json
        # windows-latest provides an interactive desktop session, so (unlike the
        # Linux job) no xvfb is needed. macOS-only specs self-skip via
        # `test.skip(!isMac)`; this verifies the cross-platform specs and, as the
        # GUI surfaces get ported, the newly un-skipped Windows specs. The
        # Windows launcher keeps Playwright's UTF-8 output out of PowerShell's
        # legacy native-output decoding pipeline.
        run: pnpm run test:desktop-e2e:windows

      - name: Verify E2E selection completed
        if: steps.e2e-tests.outcome == 'success'
        run: node scripts/ci/run-retry-failures.mjs e2e-first-verify

      - name: Select failed E2E tests
        id: e2e-selection
        if: steps.e2e-tests.outcome == 'failure'
        run: node scripts/ci/run-retry-failures.mjs e2e-prepare

      - name: Retry failed E2E tests
        id: e2e-retry
        if: steps.e2e-tests.outcome == 'failure' && steps.e2e-selection.outcome == 'success'
        continue-on-error: true
        env:
          PWRSNAP_CI_TEST_REPORT: ${{ github.workspace }}/.local/ci/retry/e2e-retry.json
          PWRSNAP_E2E_RETRY: "1"
        run: pnpm run test:desktop-e2e:windows

      - name: Check E2E retry results
        if: steps.e2e-tests.outcome == 'failure' && steps.e2e-selection.outcome == 'success'
        env:
          PWRSNAP_RETRY_OUTCOME: ${{ steps.e2e-retry.outcome }}
        run: node scripts/ci/run-retry-failures.mjs e2e-verify

      - name: Record E2E slice
        if: ${{ !cancelled() }}
        uses: ./.github/actions/flake-slice
        with:
          kind: e2e
          platform: windows
          lane: "1"
          directory: .local/ci/retry
          first-outcome: ${{ steps.e2e-tests.outcome }}
          retry-outcome: ${{ steps.e2e-retry.outcome }}

      - name: Upload desktop Playwright artifacts
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: windows-desktop-e2e-artifacts
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
            .local/ci/retry/
          include-hidden-files: true
          retention-days: 30

  desktop-e2e-result:
    # Aggregate gate over every Desktop E2E platform.
    #
    # `Desktop E2E` is a required status check in the "Protect main branch"
    # ruleset, and it used to be the Linux job's own name — so the macOS and
    # Windows lanes ran on every code-impacting PR but nothing required them,
    # and a platform-specific regression merged green. Moving the name onto
    # this job keeps that required context reporting (so the ruleset needs no
    # edit) while widening what it actually covers.
    #
    # `always()` is load-bearing. Without it a failed upstream lane leaves this
    # job *skipped*, and branch protection counts a skipped required check as
    # satisfied — the gate would silently stop gating.
    name: Desktop E2E
    runs-on: ubuntu-latest
    needs: [changes, desktop-e2e, desktop-e2e-macos, windows-e2e]
    if: >-
      always() &&
      needs.changes.outputs.code_impacting == 'true'
    timeout-minutes: 5
    steps:
      - name: Require every Desktop E2E platform
        env:
          LINUX_RESULT: ${{ needs.desktop-e2e.result }}
          MACOS_RESULT: ${{ needs.desktop-e2e-macos.result }}
          WINDOWS_RESULT: ${{ needs.windows-e2e.result }}
        run: |
          set -euo pipefail
          status=0

          # Mirror each line into the job summary so the PR checks page names
          # the platform that broke without anyone opening the job log.
          say() {
            echo "$1"
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
          }

          require() {
            if [[ "$2" == "success" ]]; then
              say "- PASS \`$1\` ($2)"
            else
              say "- FAIL \`$1\` ($2)"
              echo "::error::$1 Desktop E2E did not succeed ($2)."
              status=1
            fi
          }

          say "### Desktop E2E platform results"
          require "Linux" "$LINUX_RESULT"
          require "macOS" "$MACOS_RESULT"
          require "Windows" "$WINDOWS_RESULT"

          exit "$status"

  flake-report:
    name: Consolidate test retry reports
    runs-on: ubuntu-latest
    needs: [changes, test, windows, desktop-e2e, desktop-e2e-macos, windows-e2e]
    if: always() && needs.changes.outputs.code_impacting == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: flake-slice-${{ github.run_attempt }}-*
          path: .local/ci/flake-slices
      - name: Consolidate reports
        env:
          FLAKE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/write-flake-report.mjs aggregate
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: ci-flake-report-${{ github.run_attempt }}
          path: .local/ci/flake-report/flake-report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
