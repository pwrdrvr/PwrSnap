name: MCP native transport
on:
  pull_request:
  push:
    branches: [main, 'releases/**']
permissions:
  contents: read
concurrency:
  group: mcp-transport-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  native:
    name: MCP transport (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +1.94.1 fmt --manifest-path crates/pwrsnap-mcp/Cargo.toml --check
      - name: Check
        run: cargo +1.94.1 clippy --locked --manifest-path crates/pwrsnap-mcp/Cargo.toml --all-targets -- -D warnings
      - name: Native security and lifecycle regressions
        run: cargo +1.94.1 test --locked --manifest-path crates/pwrsnap-mcp/Cargo.toml
