packages:
  - apps/*
  - packages/*
# Keep user-level hooks out of the project checksum on every machine.
globalPnpmfile: ./.pnpmfile-global.cjs
# Scripts consume the explicitly installed tree, including release stages and
# the privileged metadata-only install that intentionally skips scripts.
verifyDepsBeforeRun: false
# Completed CI trees must contain portable files and relative workspace links.
packageImportMethod: auto
minimumReleaseAge: 10080
# Release builds produce a universal macOS app and an x64 Windows installer.
# Runtime packages like sharp publish OS+CPU-specific optional dependencies,
# so install both Darwin slices and the win32-x64 slice even when the release
# stage is prepared on a single-architecture / single-OS runner. `current`
# keeps the host's own slice (e.g. linux-x64 for the Linux unit/E2E jobs).
supportedArchitectures:
  os:
    - darwin
    - win32
    - current
  cpu:
    - x64
    - arm64
    - current
allowBuilds:
  # better-sqlite3 13 loads its bundled N-API prebuild, so nothing builds it.
  # pnpm 10 ignored its `gypfile: false` and ran a node-gyp rebuild that
  # needed Python and a C++ toolchain; pnpm 12 honors it. This keeps it that
  # way. See AGENTS.md.
  better-sqlite3: false
  # No `electron` entry: since Electron 42 the package has no install script.
  # The desktop postinstall runs our verified shared extraction cache instead.
  electron-winstaller: true
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  # Security update: GHSA-hxh3-vqpv-xpqv (hono).
  # Exempt only these pinned releases; future versions retain the age gate.
  - "hono@4.13.12"
  # Patched releases for the open Dependabot alerts; keep the exemption exact.
  - "@hono/node-server@2.1.3"
  - "body-parser@2.4.0"
  - "fast-uri@3.1.9"
  - "glob@14.0.2"
  - "ip-address@10.7.4"
  - "minimatch@11.0.1"
  - "qs@6.16.1"
  - "source-map-js@1.2.2"
  - "undici@7.30.1"
  - "vitest@4.1.12"
  - "@vitest/expect@4.1.12"
  - "@vitest/mocker@4.1.12"
  - "@vitest/pretty-format@4.1.12"
  - "@vitest/runner@4.1.12"
  - "@vitest/snapshot@4.1.12"
  - "@vitest/spy@4.1.12"
  - "@vitest/utils@4.1.12"
  # GHSA-jr5w-w6x2-84p9 eMudhra fix; npm published 2026-10-21T03:31:39.419Z.
  - "electron@44.9.3"
  # The @pwrdrvr/agent-kit packages are PwrDrvr's own, freshly published, and
  # pinned — exempt them from the 7-day minimumReleaseAge gate (which targets
  # untrusted third-party releases) so PwrSnap can consume 0.1.0 immediately.
  - "@pwrdrvr/codex-app-server-protocol"
  - "@pwrdrvr/agent-core"
  - "@pwrdrvr/agent-transport"
  - "@pwrdrvr/codex-discovery"
  - "@pwrdrvr/agent-client"
  - "@pwrdrvr/agent-acp"
  - "@pwrdrvr/agent-chat-react"

# Security and type overrides formerly stored in package.json.
overrides:
  "@types/node": "24.19.1"
  "brace-expansion@1": "1.1.21"
  "brace-expansion@2": "2.1.7"
  "brace-expansion@5": "5.0.12"
  "@hono/node-server@2": "2.1.3"
  "body-parser@2": "2.4.0"
  "fast-uri@3": "3.1.9"
  "glob@>=9 <14.0.2": "14.0.2"
  "hono@4": "4.13.12"
  "ip-address@10": "10.7.4"
  "minimatch@>=7 <11.0.1": "11.0.1"
  "qs@6": "6.16.1"
  "source-map-js@1": "1.2.2"
  "tar": "7.5.22"
  "undici@7": "7.30.1"
