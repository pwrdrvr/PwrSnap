packages:
  - apps/*
  - packages/*
# Keep user-level hooks out of the project checksum on every machine.
globalPnpmfile: ./.pnpmfile-global.cjs
# Scripts consume the explicitly installed tree, including release stages and
# the privileged metadata-only install that intentionally skips scripts.
verifyDepsBeforeRun: false
minimumReleaseAge: 10080
# Release builds produce a universal macOS app and an x64 Windows installer.
# Runtime packages like sharp publish OS+CPU-specific optional dependencies,
# so install both Darwin slices and the win32-x64 slice even when the release
# stage is prepared on a single-architecture / single-OS runner. `current`
# keeps the host's own slice (e.g. linux-x64 for the Linux unit/E2E jobs).
supportedArchitectures:
  os:
    - darwin
    - win32
    - current
  cpu:
    - x64
    - arm64
    - current
allowBuilds:
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  # Security updates: GHSA-hxh3-vqpv-xpqv (hono),
  # GHSA-2vr4-cq9g-pvrc and GHSA-h3mg-xc3c-68pw (ip-address).
  # Exempt only these pinned releases; future versions retain the age gate.
  - "hono@4.13.12"
  - "ip-address@10.7.3"
  # The @pwrdrvr/agent-kit packages are PwrDrvr's own, freshly published, and
  # pinned — exempt them from the 7-day minimumReleaseAge gate (which targets
  # untrusted third-party releases) so PwrSnap can consume 0.1.0 immediately.
  - "@pwrdrvr/codex-app-server-protocol"
  - "@pwrdrvr/agent-core"
  - "@pwrdrvr/agent-transport"
  - "@pwrdrvr/codex-discovery"
  - "@pwrdrvr/agent-client"
  - "@pwrdrvr/agent-acp"
  - "@pwrdrvr/agent-chat-react"

# Security and type overrides formerly stored in package.json.
overrides:
  "@types/node": "24.19.1"
  "brace-expansion@1": "1.1.21"
  "brace-expansion@2": "2.1.7"
  "brace-expansion@5": "5.0.12"
  "fast-uri@3": "3.1.8"
  "hono@4": "4.13.12"
  "ip-address@10": "10.7.3"
  "tar": "7.5.22"
  "undici@7": "7.30.0"
