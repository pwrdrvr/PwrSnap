name: Preview Build (macOS DMG + Windows installer)

on:
  pull_request:
    # `labeled`     — first time the build-preview label is applied.
    # `synchronize` — subsequent pushes to an already-labeled PR; without this,
    #                 the only way to re-run after a fix is to remove and
    #                 re-add the label.
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  preview:
    name: Build preview DMG
    # Run when the just-applied label is build-preview (labeled event), OR when
    # build-preview is already on the PR (synchronize event).
    if: |
      (github.event.action == 'labeled' && github.event.label.name == 'build-preview') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'build-preview'))
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        with:
          node-version: "24.14.1"

      - name: Compute preview version
        id: version
        run: |
          raw=$(node -p "require('./apps/desktop/package.json').version")
          base=$(echo "$raw" | sed 's/-.*//')
          preview="${base}-pr.${{ github.event.pull_request.number }}"
          echo "version=${preview}" >> "$GITHUB_OUTPUT"
          echo "Preview version: ${preview}"

      - name: Set preview version in package.json
        run: |
          cd apps/desktop
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.version.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      # release.mjs deliberately removes FFmpeg from a newly prepared stage so
      # a stale workspace binary can never slip into a package. Prepare first,
      # then inject the public, hash-pinned release payload below.
      - name: Prepare preview package stage
        run: node apps/desktop/scripts/release.mjs --prepare-only

      # Pull-request workflows must not enter signing environments or receive
      # the private build-repo GitHub App credentials. v1.1.0-alpha.4 publicly
      # shipped the exact vetted FFmpeg 8.1.1 build; pinning both the release ZIP
      # and its extracted signed helper makes asset replacement fail closed.
      - name: Stage controlled macOS FFmpeg from public release
        shell: bash
        env:
          FFMPEG_RELEASE_BASE_URL: https://github.com/pwrdrvr/PwrSnap/releases/download/v1.1.0-alpha.4
          FFMPEG_RELEASE_PAYLOAD: PwrSnap-1.1.0-alpha.4-universal-mac.zip
          FFMPEG_RELEASE_PAYLOAD_SHA256: 607c1ac88e2740d805780e5c3d69d5a31c675ee12f1ca5b9bc0f7ad85f5b9d15
          FFMPEG_SIGNED_BINARY_SHA256: e058fa321d48b686e586bc337b1e9876f3b9cbfc34ad6ac623a6938de4e9a868
          FFMPEG_MANIFEST_ASSET: ffmpeg-8.1.1-macos-universal-manifest.json
          FFMPEG_MANIFEST_ASSET_SHA256: fd7fe3f07c9c66b344d293f9a8fd3a48b9b30cf5bc5e441d59eb0f967e4db18d
          FFMPEG_SOURCE_ASSET: ffmpeg-8.1.1.tar.xz
          FFMPEG_SOURCE_ASSET_SHA256: b6863adde98898f42602017462871b5f6333e65aec803fdd7a6308639c52edf3
          FFMPEG_SOURCE_SUM_ASSET: ffmpeg-8.1.1.tar.xz.sha256
          FFMPEG_SOURCE_SUM_ASSET_SHA256: 7cb9f14272b77f0536fef34c1e3cd39be63760aa706c813d90c58b54e084ca93
          FFMPEG_SOURCE_OFFER_ASSET: ffmpeg-8.1.1-macos-universal-SOURCE-OFFER.txt
          FFMPEG_SOURCE_OFFER_ASSET_SHA256: 8e10bc94b7788ca035da88bff30b39fe86c3683d660ffdf2ff46bc99bb1403ed
          FFMPEG_LGPL_NOTICE_ASSET: ffmpeg-8.1.1-macos-universal-LGPL-NOTICE.txt
          FFMPEG_LGPL_NOTICE_ASSET_SHA256: 9f0c03003dfcce4ecf42a33053f551adef029986dd7315914e0f1d70143ccc29
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/pwrsnap-ffmpeg-public-release"
          stage="apps/desktop/release-stage"
          mkdir -p "$dir" "$stage/build/ffmpeg" "$stage/build/ffmpeg-source"

          download_and_verify() {
            local name="$1"
            local expected="$2"
            local target="$dir/$name"
            curl --fail --location --retry 3 --retry-all-errors \
              --output "$target" "$FFMPEG_RELEASE_BASE_URL/$name"
            local actual
            actual="$(shasum -a 256 "$target" | awk '{print $1}')"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$name SHA-256 mismatch: expected $expected, got $actual" >&2
              exit 1
            fi
          }

          download_and_verify "$FFMPEG_RELEASE_PAYLOAD" "$FFMPEG_RELEASE_PAYLOAD_SHA256"
          download_and_verify "$FFMPEG_MANIFEST_ASSET" "$FFMPEG_MANIFEST_ASSET_SHA256"
          download_and_verify "$FFMPEG_SOURCE_ASSET" "$FFMPEG_SOURCE_ASSET_SHA256"
          download_and_verify "$FFMPEG_SOURCE_SUM_ASSET" "$FFMPEG_SOURCE_SUM_ASSET_SHA256"
          download_and_verify "$FFMPEG_SOURCE_OFFER_ASSET" "$FFMPEG_SOURCE_OFFER_ASSET_SHA256"
          download_and_verify "$FFMPEG_LGPL_NOTICE_ASSET" "$FFMPEG_LGPL_NOTICE_ASSET_SHA256"

          ffmpeg_entry="PwrSnap.app/Contents/Resources/PwrSnapFFmpeg"
          if ! unzip -Z1 "$dir/$FFMPEG_RELEASE_PAYLOAD" | grep -Fxq "$ffmpeg_entry"; then
            echo "::error::$FFMPEG_RELEASE_PAYLOAD is missing $ffmpeg_entry" >&2
            exit 1
          fi
          unzip -p "$dir/$FFMPEG_RELEASE_PAYLOAD" "$ffmpeg_entry" \
            > "$stage/build/ffmpeg/ffmpeg"
          chmod 755 "$stage/build/ffmpeg/ffmpeg"
          signed_binary_sha="$(shasum -a 256 "$stage/build/ffmpeg/ffmpeg" | awk '{print $1}')"
          if [ "$signed_binary_sha" != "$FFMPEG_SIGNED_BINARY_SHA256" ]; then
            echo "::error::Extracted signed FFmpeg SHA-256 mismatch." >&2
            exit 1
          fi
          codesign --verify --strict --verbose=2 "$stage/build/ffmpeg/ffmpeg"
          lipo "$stage/build/ffmpeg/ffmpeg" -verify_arch x86_64 arm64

          cp "$dir/$FFMPEG_MANIFEST_ASSET" "$stage/build/ffmpeg-source/"
          cp "$dir/$FFMPEG_SOURCE_ASSET" "$stage/build/ffmpeg-source/"
          cp "$dir/$FFMPEG_SOURCE_SUM_ASSET" "$stage/build/ffmpeg-source/"
          cp "$dir/$FFMPEG_SOURCE_OFFER_ASSET" "$stage/build/ffmpeg-source/"
          cp "$dir/$FFMPEG_LGPL_NOTICE_ASSET" "$stage/build/ffmpeg-source/"
          (cd "$stage/build/ffmpeg-source" && shasum -a 256 -c "$FFMPEG_SOURCE_SUM_ASSET")

          encoder_help="$("$stage/build/ffmpeg/ffmpeg" -hide_banner -h encoder=h264_videotoolbox 2>&1)"
          if [[ "$encoder_help" != *"Encoder h264_videotoolbox"* ]]; then
            echo "::error::Public-release FFmpeg cannot load encoder h264_videotoolbox." >&2
            exit 1
          fi

          # Preview DMGs bundle the same THIRD_PARTY_LICENSES and source offer
          # as releases. Reconcile the public manifest against those bytes.
          node scripts/check-bundled-ffmpeg-notice.mjs \
            --manifest "$stage/build/ffmpeg-source/$FFMPEG_MANIFEST_ASSET" \
            --notice THIRD_PARTY_LICENSES \
            --source-dir "$stage/build/ffmpeg-source"

      - name: Build preview package (unsigned)
        run: node apps/desktop/scripts/release.mjs --sign-stage-only --dryrun

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: PwrSnap-${{ steps.version.outputs.version }}-preview
          path: |
            apps/desktop/release-stage/dist/*.dmg
            apps/desktop/release-stage/build/ffmpeg-source/*
          retention-days: 14

  preview-windows:
    name: Build preview installer (Windows)
    # Same build-preview label gate as the macOS preview above: build only when
    # the label is just applied (labeled) or already present on a new push
    # (synchronize). Keeps the ~20-30 min Windows pack off every PR/push.
    if: |
      (github.event.action == 'labeled' && github.event.label.name == 'build-preview') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'build-preview'))
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5

      # Same action as the macOS preview above; it runs natively on Windows.
      # No cache-priming gate job here (unlike ci.yml): this is a label-gated
      # one-off build, so there is no fan-out to prime for.
      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        with:
          node-version: "24.14.1"

      # Pull-request code receives no build-repo or signing secrets. Instead,
      # extract the exact FFmpeg binary already shipped inside the public,
      # signed v1.1.0-alpha.4 installer and pin the whole installer by SHA-256.
      - name: Stage controlled Windows FFmpeg from public release
        shell: pwsh
        env:
          FFMPEG_RELEASE_BASE_URL: https://github.com/pwrdrvr/PwrSnap/releases/download/v1.1.0-alpha.4
          FFMPEG_RELEASE_PAYLOAD: PwrSnap-1.1.0-alpha.4-windows-x64-setup.exe
          FFMPEG_RELEASE_PAYLOAD_SHA256: 88b821460701a3012a72f63225f4ed788024995f51c5b8017c89fe46f5962246
          FFMPEG_MANIFEST_ASSET: ffmpeg-8.1.1-macos-universal-manifest.json
          FFMPEG_MANIFEST_ASSET_SHA256: fd7fe3f07c9c66b344d293f9a8fd3a48b9b30cf5bc5e441d59eb0f967e4db18d
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $dir = Join-Path $env:RUNNER_TEMP "pwrsnap-windows-ffmpeg-preview"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          function Get-VerifiedReleaseAsset([string]$Name, [string]$ExpectedSha256) {
            $target = Join-Path $dir $Name
            Invoke-WebRequest `
              -Uri "$env:FFMPEG_RELEASE_BASE_URL/$Name" `
              -OutFile $target `
              -MaximumRetryCount 3
            $actual = (Get-FileHash -Algorithm SHA256 $target).Hash.ToLowerInvariant()
            if ($actual -ne $ExpectedSha256.ToLowerInvariant()) {
              throw "$Name SHA-256 mismatch: expected $ExpectedSha256, got $actual"
            }
            return $target
          }

          $installer = Get-VerifiedReleaseAsset `
            $env:FFMPEG_RELEASE_PAYLOAD `
            $env:FFMPEG_RELEASE_PAYLOAD_SHA256
          $manifestPath = Get-VerifiedReleaseAsset `
            $env:FFMPEG_MANIFEST_ASSET `
            $env:FFMPEG_MANIFEST_ASSET_SHA256

          $sevenZip = (Get-Command "7z").Source
          $installerDir = Join-Path $dir "installer"
          New-Item -ItemType Directory -Force -Path $installerDir | Out-Null
          & $sevenZip x -y "-o$installerDir" $installer
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to extract the pinned public Windows installer."
          }

          $embeddedArchive = Join-Path $installerDir '$PLUGINSDIR/app-64.7z'
          if (-not (Test-Path -LiteralPath $embeddedArchive -PathType Leaf)) {
            throw "Pinned public Windows installer is missing its embedded app-64.7z payload."
          }
          $appDir = Join-Path $dir "app"
          New-Item -ItemType Directory -Force -Path $appDir | Out-Null
          & $sevenZip x -y "-o$appDir" $embeddedArchive "resources/PwrSnapFFmpeg.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to extract PwrSnapFFmpeg.exe from the pinned public installer."
          }

          $ffmpeg = Join-Path $appDir "resources/PwrSnapFFmpeg.exe"
          if (-not (Test-Path -LiteralPath $ffmpeg -PathType Leaf)) {
            throw "Pinned public Windows installer contains no resources/PwrSnapFFmpeg.exe."
          }

          # Ask the extracted executable itself, then run the production-args
          # encode/decode smoke below. The release manifest is separately
          # hash-pinned for notice/version reconciliation.
          $encoderHelp = (& $ffmpeg -hide_banner -h encoder=h264_mf 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $encoderHelp -notmatch "Encoder h264_mf") {
            throw "Public-release Windows FFmpeg cannot load encoder h264_mf."
          }

          node scripts/check-bundled-ffmpeg-notice.mjs `
            --manifest $manifestPath `
            --notice THIRD_PARTY_LICENSES
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled FFmpeg notice check failed (exit code $LASTEXITCODE)."
          }
          "PWRSNAP_WINDOWS_FFMPEG_PATH=$ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Smoke controlled Windows FFmpeg media exports
        env:
          PWRSNAP_WINDOWS_FFMPEG_SMOKE: "1"
        run: >-
          pnpm exec vitest run --config vitest.workspace.ts
          apps/desktop/src/main/recording/__tests__/windows-ffmpeg-export-smoke.test.ts

      # windows-latest defaults to pwsh; force bash for the version-stamp steps
      # so they stay identical to the macOS preview job above.
      - name: Compute preview version
        id: version
        shell: bash
        run: |
          raw=$(node -p "require('./apps/desktop/package.json').version")
          base=$(echo "$raw" | sed 's/-.*//')
          preview="${base}-pr.${{ github.event.pull_request.number }}"
          echo "version=${preview}" >> "$GITHUB_OUTPUT"
          echo "Preview version: ${preview}"

      - name: Set preview version in package.json
        shell: bash
        run: |
          cd apps/desktop
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.version.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      # Materializes a flat node_modules stage via `pnpm deploy`, rebuilds
      # better-sqlite3's Electron-native win32-x64 sidecar, injects sharp's
      # win32-x64 slice, then runs `electron-builder --win nsis --x64`.
      # Unsigned for now (Authenticode signing is a later task). See
      # apps/desktop/scripts/package-win.mjs.
      - name: Build preview installer (unsigned)
        run: pnpm --filter @pwrsnap/desktop package:win

      # electron-builder 26.15.3 could produce a successful NSIS build whose
      # BCJ2-filtered payload silently omitted the application at install time.
      # Inspect the embedded archive filters and exercise the installer itself
      # so artifact existence alone cannot hide that regression.
      - name: Verify Windows installer artifact and installed payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Resolve-Path "apps/desktop/release-stage/dist"
          $installers = @(Get-ChildItem -Path $dist -Filter "*-setup.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer in $dist; found $($installers.Count)."
          }

          $installer = $installers[0]
          $sevenZip = (Get-Command "7z").Source
          $nsisDir = Join-Path $env:RUNNER_TEMP "pwrsnap-nsis-artifact"
          & $sevenZip x -y "-o$nsisDir" $installer.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to extract the NSIS installer for artifact inspection."
          }

          $embeddedArchive = Join-Path $nsisDir '$PLUGINSDIR/app-64.7z'
          if (-not (Test-Path -LiteralPath $embeddedArchive -PathType Leaf)) {
            throw "NSIS installer is missing the embedded app-64.7z payload."
          }
          $archiveList = @(& $sevenZip l -slt $embeddedArchive)
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to list the embedded app-64.7z payload."
          }
          $separatorIndex = [Array]::IndexOf($archiveList, "----------")
          if ($separatorIndex -lt 0 -or $separatorIndex -eq ($archiveList.Count - 1)) {
            throw "Could not locate entries in the embedded app-64.7z listing."
          }
          $entryLines = $archiveList[($separatorIndex + 1)..($archiveList.Count - 1)]
          $entryMethods = @(
            $entryLines |
              Where-Object { $_ -like "Method = *" } |
              ForEach-Object { $_.Substring(9) }
          )
          $entryPaths = @(
            $entryLines |
              Where-Object { $_ -like "Path = *" } |
              ForEach-Object { $_.Substring(7) -replace '\\', '/' }
          )
          $forbiddenPattern = '(^| )(BCJ2|ARM64|ARMT|ARM|IA64|PPC|SPARC|DELTA)(:| |$)'
          $forbiddenMethods = @($entryMethods | Where-Object { $_ -match $forbiddenPattern })
          if ($forbiddenMethods.Count -ne 0) {
            throw "Embedded NSIS payload uses unsupported filters: $($forbiddenMethods -join ', ')."
          }
          $requiredArchivePaths = @(
            "PwrSnap.exe",
            "resources/elevate.exe",
            "resources/PwrSnapWindowList.exe",
            "resources/PwrSnapFFmpeg.exe"
          )
          foreach ($path in $requiredArchivePaths) {
            if ($entryPaths -notcontains $path) {
              throw "Embedded NSIS payload is missing $path."
            }
          }
          $dllCount = @($entryPaths | Where-Object { $_ -like "*.dll" }).Count
          $nativeModuleCount = @($entryPaths | Where-Object { $_ -like "*.node" }).Count
          if ($dllCount -eq 0 -or $nativeModuleCount -eq 0) {
            throw "Embedded NSIS payload is missing DLLs or native .node binaries."
          }
          $entryMethods |
            Group-Object |
            Sort-Object Name |
            ForEach-Object {
              $label = if ($_.Name -eq "") { "<uncompressed>" } else { $_.Name }
              Write-Host "NSIS payload method: $label = $($_.Count) entries"
            }
          Write-Host "NSIS payload binaries: $dllCount DLLs, $nativeModuleCount native .node files"
          & $sevenZip t $embeddedArchive
          if ($LASTEXITCODE -ne 0) {
            throw "Embedded app-64.7z payload failed its integrity test."
          }

          $installDir = Join-Path $env:RUNNER_TEMP "pwrsnap-nsis-smoke"
          $process = Start-Process `
            -FilePath $installer.FullName `
            -ArgumentList @("/S", "/D=$installDir") `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "NSIS installer exited with code $($process.ExitCode)."
          }

          $requiredFiles = @(
            (Join-Path $installDir "PwrSnap.exe"),
            (Join-Path $installDir "resources/app.asar"),
            (Join-Path $installDir "resources/PwrSnapWindowList.exe"),
            (Join-Path $installDir "resources/PwrSnapFFmpeg.exe")
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Installed NSIS payload is missing $file."
            }
          }
          if (@(Get-ChildItem -Path $installDir -Filter "*.dll" -File -Recurse).Count -eq 0) {
            throw "Installed NSIS payload contains no DLLs."
          }
          if (@(Get-ChildItem -Path $installDir -Filter "*.node" -File -Recurse).Count -eq 0) {
            throw "Installed NSIS payload contains no native .node binaries."
          }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: PwrSnap-${{ steps.version.outputs.version }}-windows-installer
          path: |
            apps/desktop/release-stage/dist/*-setup.exe
            apps/desktop/release-stage/dist/*-setup.exe.blockmap
            apps/desktop/release-stage/dist/builder-debug.yml
          retention-days: 14
