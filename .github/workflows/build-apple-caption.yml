name: Build Apple caption helper

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
    outputs:
      sha256:
        value: ${{ jobs.compile.outputs.sha256 }}
      commit:
        value: ${{ jobs.compile.outputs.commit }}

permissions:
  contents: read
  id-token: none

jobs:
  compile:
    # The macos-26 image does not ship the SDK for image attachments. This
    # runner compiles only the helper, with no packaging or signing secrets.
    runs-on: xcode-27
    timeout-minutes: 10
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
      commit: ${{ steps.build.outputs.commit }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Compile the universal helper using stable Xcode 27.2
        id: build
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
        run: |
          set -euo pipefail
          node apps/desktop/scripts/build-apple-caption.mjs --universal
          helper=apps/desktop/build/native/apple-caption
          codesign --verify --strict "$helper"
          echo "sha256=$(shasum -a 256 "$helper" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apple-caption-native
          path: apps/desktop/build/native/apple-caption
          if-no-files-found: error
          retention-days: 3
