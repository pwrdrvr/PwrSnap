# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "PwrSnap"

[setup]
script = '''
nvm install
corepack enable
pnpm install
'''

[setup.win32]
script = '''
$ErrorActionPreference = "Stop"
$nodeVersion = (Get-Content -LiteralPath .nvmrc -Raw -ErrorAction Stop).Trim().TrimStart('v')
nvm install $nodeVersion
if ($LASTEXITCODE -ne 0) { throw "nvm install failed" }
$nodeDir = Join-Path $env:NVM_HOME "v$nodeVersion"
if (-not (Test-Path -LiteralPath (Join-Path $nodeDir 'node.exe') -PathType Leaf)) { throw "Node $nodeVersion is missing from nvm" }
$env:Path = "$nodeDir;$env:Path"
corepack.cmd enable
if ($LASTEXITCODE -ne 0) { throw "corepack enable failed" }
pnpm.cmd install
if ($LASTEXITCODE -ne 0) { throw "pnpm install failed" }
'''

[cleanup]
script = "rm -rf node_modules"

[cleanup.win32]
script = '''
if (Test-Path -LiteralPath node_modules) {
  Remove-Item -LiteralPath node_modules -Recurse -Force -ErrorAction Stop
}
'''

[[actions]]
name = "Dev"
icon = "run"
platform = "darwin"
command = '''
nvm use --silent
corepack enable
pnpm dev
'''

[[actions]]
name = "Dev"
icon = "run"
platform = "linux"
command = '''
nvm use --silent
corepack enable
pnpm dev
'''

[[actions]]
name = "Dev"
icon = "run"
platform = "win32"
command = '''
powershell.exe -NoProfile -Command {
  $ErrorActionPreference = "Stop"
  $nodeVersion = (Get-Content -LiteralPath .nvmrc -Raw -ErrorAction Stop).Trim().TrimStart('v')
  $nodeDir = Join-Path $env:NVM_HOME "v$nodeVersion"
  if (-not (Test-Path -LiteralPath (Join-Path $nodeDir 'node.exe') -PathType Leaf)) { throw "Node $nodeVersion is missing from nvm; run environment setup" }
  $env:Path = "$nodeDir;$env:Path"
  corepack.cmd enable
  if ($LASTEXITCODE -ne 0) { throw "corepack enable failed" }
  pnpm.cmd dev
  exit $LASTEXITCODE
}
'''

[[actions]]
name = "Package"
icon = "run"
platform = "darwin"
command = '''
nvm use --silent
corepack enable
pnpm --filter @pwrsnap/desktop package --dryrun
'''

[[actions]]
name = "Package"
icon = "run"
platform = "win32"
command = '''
powershell.exe -NoProfile -Command {
  $ErrorActionPreference = "Stop"
  $nodeVersion = (Get-Content -LiteralPath .nvmrc -Raw -ErrorAction Stop).Trim().TrimStart('v')
  $nodeDir = Join-Path $env:NVM_HOME "v$nodeVersion"
  if (-not (Test-Path -LiteralPath (Join-Path $nodeDir 'node.exe') -PathType Leaf)) { throw "Node $nodeVersion is missing from nvm; run environment setup" }
  $env:Path = "$nodeDir;$env:Path"
  corepack.cmd enable
  if ($LASTEXITCODE -ne 0) { throw "corepack enable failed" }
  pnpm.cmd --filter @pwrsnap/desktop package:win
  exit $LASTEXITCODE
}
'''

[[actions]]
name = "Reset TCC"
icon = "run"
platform = "darwin"
command = '''
tccutil reset SystemPolicyDocumentsFolder com.pwrdrvr.pwrsnap && tccutil reset ScreenCapture com.pwrdrvr.pwrsnap
'''

[[actions]]
name = "Dev - First Time"
icon = "run"
platform = "darwin"
command = '''
first_run_id="$(date -u +%Y%m%dT%H%M%SZ)"
mkdir -p .local
printf '%s\n' "$first_run_id" > .local/first-run
echo "PwrSnap first-run ID: $first_run_id"
PWRSNAP_USER_DATA="/tmp/pwrsnap-firstrun-$first_run_id" open -n apps/desktop/release-stage/dist/mac-universal/PwrSnap.app
'''

[[actions]]
name = "Dev - First Time Re-Run"
icon = "run"
platform = "darwin"
command = '''
if [ ! -f .local/first-run ]; then
  echo "Missing .local/first-run; run Dev - First Time first." >&2
  exit 1
fi
first_run_id="$(cat .local/first-run)"
echo "PwrSnap first-run ID: $first_run_id"
PWRSNAP_USER_DATA="/tmp/pwrsnap-firstrun-$first_run_id" open -n apps/desktop/release-stage/dist/mac-universal/PwrSnap.app
'''
