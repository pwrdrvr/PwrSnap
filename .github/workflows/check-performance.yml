name: Development Check Performance

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: check-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  paired-compilers:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'ci:check-performance'))
    runs-on: [self-hosted, macOS, ARM64, pwrdrvr-macos]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pwrdrvr/configure-nodejs@d416c1c78119b25fe03ee3ef78b75af0d69b10a7 # v1.7.1
        timeout-minutes: 10
        with:
          node-version: "^24.22.0"
          persistent-store-dir: ~/Library/Caches/pwrsnap-ci/${{ runner.name }}
          cache-electron: "true"
      - name: Compare compilers and assert coverage
        run: pnpm check:benchmark
      - name: Save measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-check-performance
          path: .local/check-performance/paired.json
          if-no-files-found: warn
