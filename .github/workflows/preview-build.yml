name: Preview Build (macOS DMG + Windows installer)

on:
  pull_request:
    # `labeled`     — first time the build-preview label is applied.
    # `synchronize` — subsequent pushes to an already-labeled PR; without this,
    #                 the only way to re-run after a fix is to remove and
    #                 re-add the label.
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  preview:
    name: Build preview DMG
    # Run when the just-applied label is build-preview (labeled event), OR when
    # build-preview is already on the PR (synchronize event).
    if: |
      (github.event.action == 'labeled' && github.event.label.name == 'build-preview') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'build-preview'))
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        with:
          node-version: "24.14.1"

      # Preview DMGs use the SAME controlled ffmpeg as releases. They used to
      # build one locally from an in-repo script whose flags had drifted, so a
      # preview DMG and the release DMG from the same commit shipped different
      # codec sets — that divergence hid a missing PNG decoder in released
      # builds. See docs/ffmpeg-build-reference.md.
      - name: Create FFmpeg build repo token
        id: ffmpeg-builds-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FFMPEG_BUILDS_APP_CLIENT_ID }}
          private-key: ${{ secrets.FFMPEG_BUILDS_APP_PRIVATE_KEY }}
          owner: pwrdrvr
          repositories: pwrsnap-ffmpeg-builds
          permission-actions: read
          permission-contents: read

      - name: Download controlled macOS FFmpeg artifact
        shell: bash
        env:
          GH_TOKEN: ${{ steps.ffmpeg-builds-token.outputs.token }}
          FFMPEG_BUILD_REPO: pwrdrvr/pwrsnap-ffmpeg-builds
          FFMPEG_BUILD_WORKFLOW: build.yml
          # Keep in lockstep with the two FFMPEG_BUILD_SHA pins in release.yml.
          FFMPEG_BUILD_SHA: 3d775403a83990a2ad9503d865f5d481d9c0316a
          FFMPEG_ARTIFACT_NAME: ffmpeg-8.1.1-macos-universal
        run: |
          set -euo pipefail
          run_id="$(
            gh run list \
              --repo "$FFMPEG_BUILD_REPO" \
              --workflow "$FFMPEG_BUILD_WORKFLOW" \
              --branch main \
              --limit 100 \
              --json databaseId,headSha,conclusion \
              --jq ".[] | select(.headSha == \"$FFMPEG_BUILD_SHA\" and .conclusion == \"success\") | .databaseId" \
              | head -n 1
          )"
          if [ -z "$run_id" ]; then
            echo "::error::No successful $FFMPEG_BUILD_WORKFLOW run found for $FFMPEG_BUILD_REPO@$FFMPEG_BUILD_SHA" >&2
            exit 1
          fi
          dir="$RUNNER_TEMP/pwrsnap-ffmpeg-artifact"
          rm -rf "$dir" && mkdir -p "$dir"
          gh run download "$run_id" --repo "$FFMPEG_BUILD_REPO" --name "$FFMPEG_ARTIFACT_NAME" --dir "$dir"
          mkdir -p apps/desktop/build/ffmpeg apps/desktop/build/ffmpeg-source
          cp "$dir/ffmpeg" apps/desktop/build/ffmpeg/ffmpeg
          chmod 755 apps/desktop/build/ffmpeg/ffmpeg
          cp "$dir"/source/ffmpeg-*.tar.xz apps/desktop/build/ffmpeg-source/
          cp "$dir"/source/ffmpeg-*.tar.xz.sha256 apps/desktop/build/ffmpeg-source/
          cp "$dir/manifest.json" apps/desktop/build/ffmpeg-source/ffmpeg-8.1.1-macos-universal-manifest.json
          cp "$dir/SOURCE-OFFER.txt" apps/desktop/build/ffmpeg-source/ffmpeg-8.1.1-macos-universal-SOURCE-OFFER.txt
          cp "$dir/LGPL-NOTICE.txt" apps/desktop/build/ffmpeg-source/ffmpeg-8.1.1-macos-universal-LGPL-NOTICE.txt

          # Preview DMGs bundle the same THIRD_PARTY_LICENSES the release does,
          # so run the same artifact-vs-notice reconciliation the signing jobs
          # run. A PR that repins the build repo to a new FFmpeg version fails
          # here, rather than at tag time.
          node scripts/check-bundled-ffmpeg-notice.mjs \
            --manifest "$dir/manifest.json" \
            --notice THIRD_PARTY_LICENSES \
            --source-dir "$dir/source"

      - name: Compute preview version
        id: version
        run: |
          raw=$(node -p "require('./apps/desktop/package.json').version")
          base=$(echo "$raw" | sed 's/-.*//')
          preview="${base}-pr.${{ github.event.pull_request.number }}"
          echo "version=${preview}" >> "$GITHUB_OUTPUT"
          echo "Preview version: ${preview}"

      - name: Set preview version in package.json
        run: |
          cd apps/desktop
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.version.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build native helpers
        run: pnpm --filter @pwrsnap/desktop build:native

      - name: Build preview package (unsigned)
        run: pnpm --filter @pwrsnap/desktop package:dryrun

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: PwrSnap-${{ steps.version.outputs.version }}-preview
          path: |
            apps/desktop/release-stage/dist/*.dmg
            apps/desktop/build/ffmpeg-source/*
          retention-days: 14

  preview-windows:
    name: Build preview installer (Windows)
    # Same build-preview label gate as the macOS preview above: build only when
    # the label is just applied (labeled) or already present on a new push
    # (synchronize). Keeps the ~20-30 min Windows pack off every PR/push.
    if: |
      (github.event.action == 'labeled' && github.event.label.name == 'build-preview') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'build-preview'))
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5

      # Same action as the macOS preview above; it runs natively on Windows.
      # No cache-priming gate job here (unlike ci.yml): this is a label-gated
      # one-off build, so there is no fan-out to prime for.
      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        with:
          node-version: "24.14.1"

      # Preview installers must exercise the same controlled Windows FFmpeg
      # artifact as tagged releases. Otherwise GIF happens to work while MP4
      # silently depends on a runner/user PATH and the preview is not a valid
      # test of what PwrSnap ships.
      - name: Create Windows FFmpeg build repo token
        id: windows-ffmpeg-builds-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FFMPEG_BUILDS_APP_CLIENT_ID }}
          private-key: ${{ secrets.FFMPEG_BUILDS_APP_PRIVATE_KEY }}
          owner: pwrdrvr
          repositories: pwrsnap-ffmpeg-builds
          permission-actions: read
          permission-contents: read

      - name: Download controlled Windows FFmpeg artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.windows-ffmpeg-builds-token.outputs.token }}
          FFMPEG_BUILD_REPO: pwrdrvr/pwrsnap-ffmpeg-builds
          FFMPEG_BUILD_WORKFLOW: build.yml
          # Keep in lockstep with release.yml and the macOS preview job.
          FFMPEG_BUILD_SHA: 3d775403a83990a2ad9503d865f5d481d9c0316a
          FFMPEG_ARTIFACT_NAME: ffmpeg-8.1.1-windows-x64
        run: |
          $ErrorActionPreference = "Stop"
          $runsJson = gh run list `
            --repo $env:FFMPEG_BUILD_REPO `
            --workflow $env:FFMPEG_BUILD_WORKFLOW `
            --commit $env:FFMPEG_BUILD_SHA `
            --limit 20 `
            --json databaseId,headSha,conclusion,status
          $run = $runsJson |
            ConvertFrom-Json |
            Where-Object { $_.headSha -eq $env:FFMPEG_BUILD_SHA -and $_.conclusion -eq "success" } |
            Select-Object -First 1
          if ($null -eq $run) {
            throw "No successful $env:FFMPEG_BUILD_WORKFLOW run found for $env:FFMPEG_BUILD_REPO@$env:FFMPEG_BUILD_SHA"
          }

          $dir = Join-Path $env:RUNNER_TEMP "pwrsnap-windows-ffmpeg-preview"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          gh run download $run.databaseId `
            --repo $env:FFMPEG_BUILD_REPO `
            --name $env:FFMPEG_ARTIFACT_NAME `
            --dir $dir

          $manifestPath = Join-Path $dir "manifest.json"
          $ffmpeg = Join-Path $dir "ffmpeg.exe"
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf) -or
              -not (Test-Path -LiteralPath $ffmpeg -PathType Leaf)) {
            throw "Controlled Windows FFmpeg artifact is incomplete."
          }
          $manifest = Get-Content -Raw $manifestPath | ConvertFrom-Json
          if ($manifest.platform -ne "windows" -or $manifest.arch -ne "x64" -or
              $manifest.binary -ne "ffmpeg.exe") {
            throw "Windows FFmpeg artifact target mismatch: $($manifest.platform)/$($manifest.arch)/$($manifest.binary)"
          }
          $actual = (Get-FileHash -Algorithm SHA256 $ffmpeg).Hash.ToLowerInvariant()
          if ($actual -ne ([string]$manifest.sha256).ToLowerInvariant()) {
            throw "Windows FFmpeg artifact hash mismatch."
          }
          foreach ($encoder in @("h264_mf", "aac")) {
            if ($manifest.requiredEncoders -notcontains $encoder) {
              throw "Windows FFmpeg manifest is missing required encoder check: $encoder"
            }
          }

          # Ask the downloaded executable itself, not only its manifest. This
          # is a durable diagnostic for a corrupt/wrong binary before packaging.
          $encoderHelp = (& $ffmpeg -hide_banner -h encoder=h264_mf 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $encoderHelp -notmatch "Encoder h264_mf") {
            throw "Downloaded Windows FFmpeg cannot load encoder h264_mf."
          }

          node scripts/check-bundled-ffmpeg-notice.mjs `
            --manifest $manifestPath `
            --notice THIRD_PARTY_LICENSES
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled FFmpeg notice check failed (exit code $LASTEXITCODE)."
          }
          "PWRSNAP_WINDOWS_FFMPEG_PATH=$ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Smoke controlled Windows FFmpeg media exports
        env:
          PWRSNAP_WINDOWS_FFMPEG_SMOKE: "1"
        run: >-
          pnpm exec vitest run --config vitest.workspace.ts
          apps/desktop/src/main/recording/__tests__/windows-ffmpeg-export-smoke.test.ts

      # windows-latest defaults to pwsh; force bash for the version-stamp steps
      # so they stay identical to the macOS preview job above.
      - name: Compute preview version
        id: version
        shell: bash
        run: |
          raw=$(node -p "require('./apps/desktop/package.json').version")
          base=$(echo "$raw" | sed 's/-.*//')
          preview="${base}-pr.${{ github.event.pull_request.number }}"
          echo "version=${preview}" >> "$GITHUB_OUTPUT"
          echo "Preview version: ${preview}"

      - name: Set preview version in package.json
        shell: bash
        run: |
          cd apps/desktop
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.version.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      # Materializes a flat node_modules stage via `pnpm deploy`, rebuilds
      # better-sqlite3's Electron-native win32-x64 sidecar, injects sharp's
      # win32-x64 slice, then runs `electron-builder --win nsis --x64`.
      # Unsigned for now (Authenticode signing is a later task). See
      # apps/desktop/scripts/package-win.mjs.
      - name: Build preview installer (unsigned)
        run: pnpm --filter @pwrsnap/desktop package:win

      # electron-builder 26.15.3 could produce a successful NSIS build whose
      # BCJ2-filtered payload silently omitted the application at install time.
      # Inspect the embedded archive filters and exercise the installer itself
      # so artifact existence alone cannot hide that regression.
      - name: Verify Windows installer artifact and installed payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Resolve-Path "apps/desktop/release-stage/dist"
          $installers = @(Get-ChildItem -Path $dist -Filter "*-setup.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer in $dist; found $($installers.Count)."
          }

          $installer = $installers[0]
          $sevenZip = (Get-Command "7z").Source
          $nsisDir = Join-Path $env:RUNNER_TEMP "pwrsnap-nsis-artifact"
          & $sevenZip x -y "-o$nsisDir" $installer.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to extract the NSIS installer for artifact inspection."
          }

          $embeddedArchive = Join-Path $nsisDir '$PLUGINSDIR/app-64.7z'
          if (-not (Test-Path -LiteralPath $embeddedArchive -PathType Leaf)) {
            throw "NSIS installer is missing the embedded app-64.7z payload."
          }
          $archiveList = @(& $sevenZip l -slt $embeddedArchive)
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to list the embedded app-64.7z payload."
          }
          $separatorIndex = [Array]::IndexOf($archiveList, "----------")
          if ($separatorIndex -lt 0 -or $separatorIndex -eq ($archiveList.Count - 1)) {
            throw "Could not locate entries in the embedded app-64.7z listing."
          }
          $entryLines = $archiveList[($separatorIndex + 1)..($archiveList.Count - 1)]
          $entryMethods = @(
            $entryLines |
              Where-Object { $_ -like "Method = *" } |
              ForEach-Object { $_.Substring(9) }
          )
          $entryPaths = @(
            $entryLines |
              Where-Object { $_ -like "Path = *" } |
              ForEach-Object { $_.Substring(7) -replace '\\', '/' }
          )
          $forbiddenPattern = '(^| )(BCJ2|ARM64|ARMT|ARM|IA64|PPC|SPARC|DELTA)(:| |$)'
          $forbiddenMethods = @($entryMethods | Where-Object { $_ -match $forbiddenPattern })
          if ($forbiddenMethods.Count -ne 0) {
            throw "Embedded NSIS payload uses unsupported filters: $($forbiddenMethods -join ', ')."
          }
          $requiredArchivePaths = @(
            "PwrSnap.exe",
            "resources/elevate.exe",
            "resources/PwrSnapWindowList.exe",
            "resources/PwrSnapFFmpeg.exe"
          )
          foreach ($path in $requiredArchivePaths) {
            if ($entryPaths -notcontains $path) {
              throw "Embedded NSIS payload is missing $path."
            }
          }
          $dllCount = @($entryPaths | Where-Object { $_ -like "*.dll" }).Count
          $nativeModuleCount = @($entryPaths | Where-Object { $_ -like "*.node" }).Count
          if ($dllCount -eq 0 -or $nativeModuleCount -eq 0) {
            throw "Embedded NSIS payload is missing DLLs or native .node binaries."
          }
          $entryMethods |
            Group-Object |
            Sort-Object Name |
            ForEach-Object {
              $label = if ($_.Name -eq "") { "<uncompressed>" } else { $_.Name }
              Write-Host "NSIS payload method: $label = $($_.Count) entries"
            }
          Write-Host "NSIS payload binaries: $dllCount DLLs, $nativeModuleCount native .node files"
          & $sevenZip t $embeddedArchive
          if ($LASTEXITCODE -ne 0) {
            throw "Embedded app-64.7z payload failed its integrity test."
          }

          $installDir = Join-Path $env:RUNNER_TEMP "pwrsnap-nsis-smoke"
          $process = Start-Process `
            -FilePath $installer.FullName `
            -ArgumentList @("/S", "/D=$installDir") `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "NSIS installer exited with code $($process.ExitCode)."
          }

          $requiredFiles = @(
            (Join-Path $installDir "PwrSnap.exe"),
            (Join-Path $installDir "resources/app.asar"),
            (Join-Path $installDir "resources/PwrSnapWindowList.exe"),
            (Join-Path $installDir "resources/PwrSnapFFmpeg.exe")
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Installed NSIS payload is missing $file."
            }
          }
          if (@(Get-ChildItem -Path $installDir -Filter "*.dll" -File -Recurse).Count -eq 0) {
            throw "Installed NSIS payload contains no DLLs."
          }
          if (@(Get-ChildItem -Path $installDir -Filter "*.node" -File -Recurse).Count -eq 0) {
            throw "Installed NSIS payload contains no native .node binaries."
          }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: PwrSnap-${{ steps.version.outputs.version }}-windows-installer
          path: |
            apps/desktop/release-stage/dist/*-setup.exe
            apps/desktop/release-stage/dist/*-setup.exe.blockmap
            apps/desktop/release-stage/dist/builder-debug.yml
          retention-days: 14
