name: Select the macOS 15-compatible Xcode with actool 26
description: >-
  electron-builder compiles build/icon.icon (an Icon Composer package) with
  actool and hard-fails below actool 26, while GitHub's macos-15 image
  defaults to Xcode 16.4. Xcode 26.3's AssetCatalogAgent crashes on that
  host, so this pins the known-compatible Xcode 26.0.1 installation. Consumers
  set DEVELOPER_DIR from the output on exactly the steps that run actool (the
  unit tests, electron-builder), so the icon compile does not move the native
  helper builds onto a different SDK. See AGENTS.md "macOS app icon".

outputs:
  developer-dir:
    description: DEVELOPER_DIR for the selected Xcode.
    value: ${{ steps.select.outputs.developer-dir }}

runs:
  using: composite
  steps:
    - name: Select Xcode 26.0.1 with actool 26 or newer
      id: select
      shell: bash
      run: |
        set -euo pipefail
        # Xcode 26.3's AssetCatalogAgent links against frameworks unavailable
        # on the macos-15 host and exits 255 while compiling Icon Composer
        # packages. Do not select the newest Xcode here without moving the
        # release runner and verifying a signed package end to end.
        developer_dir="/Applications/Xcode_26.0.1.app/Contents/Developer"
        if [ ! -x "$developer_dir/usr/bin/actool" ]; then
          echo "::error::Xcode 26.0.1 is required to compile build/icon.icon on macos-15" >&2
          exit 1
        fi
        # actool prints a plist. plistlib.loads() reads a pipe; load() seeks
        # to sniff the format and fails on stdin with "not seekable".
        version="$(DEVELOPER_DIR="$developer_dir" xcrun actool --version \
          | python3 -c 'import plistlib, sys; print(plistlib.loads(sys.stdin.buffer.read())["com.apple.actool.version"]["short-bundle-version"])')"
        echo "$developer_dir: actool $version"
        if [ "${version%%.*}" -lt 26 ]; then
          echo "::error::Xcode 26.0.1 actool must be 26 or newer; got $version" >&2
          exit 1
        fi
        echo "DEVELOPER_DIR=$developer_dir"
        echo "developer-dir=$developer_dir" >> "$GITHUB_OUTPUT"
