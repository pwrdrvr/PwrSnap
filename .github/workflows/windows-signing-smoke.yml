name: Windows Signing Smoke

on:
  pull_request:
    types:
      - labeled
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  windows-signing-preflight:
    name: Windows signing preflight (label-gated)
    # This job is credential-free, so fork PRs may prove that a fresh
    # non-interactive PowerShell 7 process resolves Invoke-TrustedSigning.
    if: ${{ contains(github.event.pull_request.labels.*.name, 'ci:windows-signing') }}
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install and verify TrustedSigning
        shell: pwsh -NoProfile -NonInteractive -File {0}
        run: ./scripts/release/install-trusted-signing.ps1

  windows-signing-prepare:
    name: Prepare Windows signing smoke input
    needs: windows-signing-preflight
    if: >-
      ${{
        contains(github.event.pull_request.labels.*.name, 'ci:windows-signing')
        && github.event.pull_request.head.repo.full_name == github.repository
      }}
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      signing-input-sha256: ${{ steps.archive.outputs.sha256 }}
    permissions:
      contents: read
      id-token: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@e1bd1cc1494a20f0ee91dae622b0d2523b6fb53c # v1.4.0
        with:
          node-version: "24.14.1"
          cache-electron: "true"

      - name: Prepare Windows release stage
        run: node apps/desktop/scripts/package-win.mjs --prepare-only

      - name: Archive Windows signing smoke input
        id: archive
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "windows-signing-smoke-input.tgz"
          ./scripts/release/archive-windows-signing-input.ps1 -ArchivePath $archive
          $sha256 = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "sha256=$sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "$sha256  windows-signing-smoke-input.tgz" |
            Set-Content -Path "$archive.sha256" -Encoding ascii

      - name: Upload Windows signing smoke input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-signing-smoke-input
          path: |
            ${{ runner.temp }}/windows-signing-smoke-input.tgz
            ${{ runner.temp }}/windows-signing-smoke-input.tgz.sha256
          retention-days: 7

  windows-signing:
    name: Windows signed installer smoke (protected, label-gated)
    needs: windows-signing-prepare
    if: >-
      ${{
        contains(github.event.pull_request.labels.*.name, 'ci:windows-signing')
        && github.event.pull_request.head.repo.full_name == github.repository
      }}
    # Only this job receives the environment-scoped signing credentials. It
    # does not check out source or install project dependencies/lifecycle code.
    environment: windows-signing
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: none
    steps:
      - name: Download Windows signing smoke input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-signing-smoke-input
          path: .release-input

      - name: Verify Windows signing smoke input
        shell: pwsh
        env:
          EXPECTED_SHA256: ${{ needs.windows-signing-prepare.outputs.signing-input-sha256 }}
        run: |
          $archive = ".release-input/windows-signing-smoke-input.tgz"
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SHA256) {
            throw "Windows signing input digest mismatch: expected $env:EXPECTED_SHA256, got $actual."
          }
          $recorded = (Get-Content "$archive.sha256" -Raw).Trim()
          if ($recorded -ne "$actual  windows-signing-smoke-input.tgz") {
            throw "Windows signing input checksum file does not match the downloaded archive."
          }

      - name: Expand Windows signing smoke input
        shell: pwsh
        run: |
          & tar.exe -xzf .release-input/windows-signing-smoke-input.tgz
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to expand Windows signing input (exit code $LASTEXITCODE)."
          }

      - name: Create FFmpeg build repo token
        id: ffmpeg-builds-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FFMPEG_BUILDS_APP_CLIENT_ID }}
          private-key: ${{ secrets.FFMPEG_BUILDS_APP_PRIVATE_KEY }}
          owner: pwrdrvr
          repositories: pwrsnap-ffmpeg-builds
          permission-actions: read
          permission-contents: read

      - name: Download controlled Windows FFmpeg artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.ffmpeg-builds-token.outputs.token }}
          FFMPEG_BUILD_REPO: pwrdrvr/pwrsnap-ffmpeg-builds
          FFMPEG_BUILD_WORKFLOW: build.yml
          FFMPEG_BUILD_SHA: a72aa24cd310cb3aa684b2481261cb2d8e313bfd
          FFMPEG_ARTIFACT_NAME: ffmpeg-8.1.1-windows-x64
          FFMPEG_VERSION: 8.1.1
          FFMPEG_SOURCE_SHA256: b6863adde98898f42602017462871b5f6333e65aec803fdd7a6308639c52edf3
          FFMPEG_BUILD_PROFILE: pwrsnap-lgpl-clean-v1
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw "GH_TOKEN is required to download the private PwrSnap FFmpeg build artifact."
          }

          $runsJson = gh run list `
            --repo $env:FFMPEG_BUILD_REPO `
            --workflow $env:FFMPEG_BUILD_WORKFLOW `
            --branch main `
            --limit 100 `
            --json databaseId,headSha,conclusion,status
          $run = $runsJson |
            ConvertFrom-Json |
            Where-Object { $_.headSha -eq $env:FFMPEG_BUILD_SHA -and $_.conclusion -eq "success" } |
            Select-Object -First 1
          if ($null -eq $run) {
            throw "No successful $env:FFMPEG_BUILD_WORKFLOW run found for $env:FFMPEG_BUILD_REPO@$env:FFMPEG_BUILD_SHA"
          }

          $dir = Join-Path $env:RUNNER_TEMP "pwrsnap-ffmpeg-artifact"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          gh run download $run.databaseId `
            --repo $env:FFMPEG_BUILD_REPO `
            --name $env:FFMPEG_ARTIFACT_NAME `
            --dir $dir

          $manifestPath = Join-Path $dir "manifest.json"
          if (-not (Test-Path $manifestPath)) {
            throw "Downloaded FFmpeg artifact is missing manifest.json"
          }
          $manifest = Get-Content -Raw $manifestPath | ConvertFrom-Json
          if ($manifest.version -ne $env:FFMPEG_VERSION) {
            throw "Windows FFmpeg version mismatch: expected $env:FFMPEG_VERSION, got $($manifest.version)"
          }
          if ($manifest.sourceSha256 -ne $env:FFMPEG_SOURCE_SHA256) {
            throw "Windows FFmpeg source SHA mismatch: expected $env:FFMPEG_SOURCE_SHA256, got $($manifest.sourceSha256)"
          }
          if ($manifest.buildProfile -ne $env:FFMPEG_BUILD_PROFILE) {
            throw "Windows FFmpeg build profile mismatch: expected $env:FFMPEG_BUILD_PROFILE, got $($manifest.buildProfile)"
          }
          if ($manifest.platform -ne "windows" -or $manifest.arch -ne "x64" -or $manifest.binary -ne "ffmpeg.exe") {
            throw "Windows FFmpeg artifact manifest target mismatch: $($manifest.platform)/$($manifest.arch)/$($manifest.binary)"
          }

          $ffmpeg = Join-Path $dir "ffmpeg.exe"
          if (-not (Test-Path $ffmpeg)) {
            throw "Downloaded FFmpeg artifact is missing ffmpeg.exe"
          }
          $actual = (Get-FileHash -Algorithm SHA256 $ffmpeg).Hash.ToLowerInvariant()
          $expected = [string]$manifest.sha256
          if ($actual -ne $expected) {
            throw "Windows ffmpeg SHA-256 mismatch: expected $expected, got $actual"
          }

          foreach ($flag in $manifest.forbiddenConfigFlags) {
            if ([string]$manifest.configuration -like "*$flag*") {
              throw "Windows FFmpeg manifest contains forbidden configure flag: $flag"
            }
          }
          foreach ($encoder in @("h264_mf", "aac")) {
            if ($manifest.requiredEncoders -notcontains $encoder) {
              throw "Windows FFmpeg manifest is missing required encoder check: $encoder"
            }
          }
          if ($manifest.requiredDevices -notcontains "gdigrab") {
            throw "Windows FFmpeg manifest is missing required gdigrab check"
          }

          "PWRSNAP_WINDOWS_FFMPEG_PATH=$ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install TrustedSigning
        shell: pwsh -NoProfile -NonInteractive -File {0}
        run: ./scripts/release/install-trusted-signing.ps1

      - name: Sign and package Windows installer
        env:
          WIN_AZURE_SIGN_PUBLISHER_NAME: ${{ vars.WIN_AZURE_SIGN_PUBLISHER_NAME }}
          WIN_AZURE_SIGN_ENDPOINT: ${{ vars.WIN_AZURE_SIGN_ENDPOINT }}
          WIN_AZURE_SIGN_ACCOUNT: ${{ vars.WIN_AZURE_SIGN_ACCOUNT }}
          WIN_AZURE_SIGN_PROFILE: ${{ vars.WIN_AZURE_SIGN_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: >-
          node apps/desktop/scripts/package-win.mjs
          --sign-stage-only --release --require-signing

      - name: Verify Authenticode signatures
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: ${{ vars.WIN_AZURE_SIGN_PUBLISHER_NAME }}
        run: |
          $dist = "apps/desktop/release-stage/dist"
          $installer = Get-ChildItem $dist -File -Filter "*-setup.exe" | Select-Object -First 1
          $app = Get-ChildItem $dist -Recurse -File -Filter "PwrSnap.exe" | Select-Object -First 1
          foreach ($target in @($installer, $app)) {
            if ($null -eq $target) {
              throw "Expected signed Windows executable is missing."
            }
            $signature = Get-AuthenticodeSignature $target.FullName
            if ($signature.Status -ne "Valid") {
              throw "Authenticode signature is not valid for $($target.FullName): $($signature.Status)"
            }
            if ($signature.SignerCertificate.Subject -notlike "*CN=$env:EXPECTED_PUBLISHER*") {
              throw "Unexpected Authenticode signer for $($target.FullName): $($signature.SignerCertificate.Subject)"
            }
          }

      - name: Upload signed Windows installer smoke artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-signed-installer-pr
          path: |
            apps/desktop/release-stage/dist/*-setup.exe
            apps/desktop/release-stage/dist/*-setup.exe.blockmap
            apps/desktop/release-stage/dist/latest.yml
            apps/desktop/release-stage/dist/SHA256SUMS
          retention-days: 7
